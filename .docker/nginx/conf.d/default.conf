# Vigil — tracking + postback router
#
# Deux chemins distincts, volontairement :
#   /c/*  et  /pb   -> front controllers nus (PDO seul, pas de framework)
#   tout le reste   -> Slim 4 (back-office)
# Melanger les deux ferait payer le boot du framework a chaque clic.

map $http_user_agent $vigil_log_ua { default $http_user_agent; }

# $uri et NON $request : la chaine de requete du chemin chaud porte les valeurs
# de pre-remplissage du kit mailing — nom, adresse electronique, telephone,
# date de naissance. Les journaliser reconstituerait dans /var/log ce qu'on
# prend soin de ne pas ecrire en base. Le token du lien est dans $uri, il suffit
# a retrouver la campagne et le publisher.
log_format vigil_track '$remote_addr $time_iso8601 "$request_method $uri" $status $request_time';

upstream vigil_fpm {
    server vigil_php:9000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name vigil.confluent-digital.com localhost;

    root /data/www/vigil.confluent-digital.com/public;
    index index.php;

    client_max_body_size 16m;
    server_tokens off;

    # Format sans chaine de requete applique par DEFAUT a tout le serveur, et
    # pas seulement au chemin chaud : une location ajoutee plus tard sans
    # `access_log` explicite herite d'ici, et ne peut donc pas reintroduire la
    # fuite. C'est ce qui s'etait produit avec une `named location`, qui
    # n'herite pas du `access_log` du bloc qui l'appelle.
    access_log /var/log/nginx/vigil_access.log vigil_track;
    error_log  /var/log/nginx/vigil_error.log warn;

    # ── Chemin chaud : le clic ────────────────────────────────────────────
    # /c/<token>?...  -> 302 vers le money site
    #
    # fastcgi_pass direct, sans `try_files ... @named` : l'indirection
    # n'apportait rien et faisait perdre la directive `access_log` du bloc.
    location ^~ /c/ {
        access_log /var/log/nginx/vigil_click.log vigil_track;

        fastcgi_pass vigil_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/c.php;
        fastcgi_param SCRIPT_NAME     /c.php;
        fastcgi_keep_conn on;
    }

    # ── Chemin chaud : le postback entrant du money site ──────────────────
    location = /pb {
        access_log /var/log/nginx/vigil_postback.log vigil_track;
        fastcgi_pass vigil_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/pb.php;
        fastcgi_param SCRIPT_NAME     /pb.php;
        fastcgi_keep_conn on;
    }

    # ── Back-office Slim 4 ────────────────────────────────────────────────
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass vigil_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_keep_conn on;
    }

    # Aucun autre .php n'est executable directement.
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known) { deny all; }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff2?|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
