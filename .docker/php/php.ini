; Vigil — reglages PHP-FPM. Charge apres zz-slim-defaults.ini (ordre alphabetique).
memory_limit = 512M
max_execution_time = 300
expose_php = Off

; Tout est en UTC : l'image de base pose Europe/Paris, on la surcharge.
; Cent pour cent des ecarts de reporting viennent d'un fuseau qui traine.
date.timezone = UTC

; OPcache : le chemin chaud n'a de sens qu'avec le bytecode deja compile.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; APCu : cache campagnes du chemin chaud.
apc.enabled = 1
apc.enable_cli = 0
apc.shm_size = 64M

; Xdebug est charge par l'image de base en mode "develop" : il coute de l'ordre
; de 30 a 50 % sur chaque requete, y compris sans session de debug active.
; Sur /c et /pb c'est inacceptable. Le passer a "debug,develop" ponctuellement
; en dev, jamais en production.
xdebug.mode = off

realpath_cache_size = 4096k
realpath_cache_ttl = 600
